    </style>

    <!-- track 0: full-bleed ground -->
    <div id="f02s-bg" class="clip f02s-clip" data-start="0" data-duration="5" data-track-index="0"></div>

    <!-- track 1: kicker + two-beat claim -->
    <div class="clip f02s-clip" data-start="0" data-duration="5" data-track-index="1">
      <div class="f02s-rule" id="f02s-rule"></div>
      <div class="f02s-kicker" id="f02s-kicker">La soluci&oacute;n</div>
      <h1 class="f02s-claim">
        <span class="f02s-line">
          <span class="f02s-w">dales</span>
          <span class="f02s-w">una</span>
          <span class="f02s-w">tarjeta</span>
        </span>
        <span class="f02s-line">
          <span class="f02s-w2">que</span>
          <span class="f02s-w2">vive</span>
          <span class="f02s-w2">en</span>
          <span class="f02s-w2">su</span>
          <span class="f02s-w2 f02s-accent" id="f02s-kw">celular</span>
        </span>
      </h1>
    </div>

    <!-- track 2: glow + real loyalty card (spring-pop hero) -->
    <div class="clip f02s-clip" data-start="1" data-duration="4" data-track-index="2">
      <svg width="0" height="0" style="position: absolute" aria-hidden="true">
        <filter id="f02s-streak" x="-60%" y="-60%" width="220%" height="220%">
          <feGaussianBlur id="f02s-streak-blur" in="SourceGraphic" stdDeviation="0 26" />
        </filter>
      </svg>
      <div id="f02s-glow"></div>
      <div id="f02s-jitter">
        <div id="f02s-move" style="filter: url(#f02s-streak)">
          <div class="f02s-cardcrop">
            <img class="f02s-cardimg" src="assets/ejemplo1.webp" alt="" />

    <!-- track 4: snapshot de clientas (prueba social) -->
    <div class="clip f02s-clip" data-start="1.8" data-duration="3.2" data-track-index="4">

    <!-- track 3: Apple Wallet badge slides in under the card -->
    <div class="clip f02s-clip" data-start="2.5" data-duration="2.5" data-track-index="3">

        alt=""

    <script src="assets/gsap.min.js"></script>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        var tl = gsap.timeline({ paused: true });

        /* ── Scene 1 (0.0–1.1s) — claim in two per-word staggered beats ─────
           kinetic-beat-slam: one grid, distinct entrance per beat.          */
        var PULSE = 0.07;
        var BEAT1 = 0.12;
        var BEAT2 = 0.55;

        // chrome first: rule stub draws, kicker fades in
        tl.fromTo(
          "#f02s-rule",
          { scaleX: 0 },
          { scaleX: 1, duration: 0.35, ease: "power3.out" },
          0.02
        );
        tl.fromTo(
          "#f02s-kicker",
          { opacity: 0 },
          { opacity: 1, duration: 0.4, ease: "power2.out" },
          0.06
        );

        // beat 1 — "dales una tarjeta": rise + blur slam
        gsap.utils.toArray(".f02s-w").forEach(function (el, i) {
          tl.fromTo(
            el,
            { y: 34, opacity: 0, filter: "blur(12px)" },
            {
              y: 0,
              opacity: 1,
              filter: "blur(0px)",
              duration: 0.55,
              ease: "power4.out",
            },
            BEAT1 + i * PULSE
          );
        });

        // beat 2 — "que vive en su celular": side snap + blur (distinct axis)
        gsap.utils.toArray(".f02s-w2").forEach(function (el, i) {
          tl.fromTo(
            el,
            { x: -46, opacity: 0, filter: "blur(10px)" },
            {
              x: 0,
              opacity: 1,
              filter: "blur(0px)",
              duration: 0.5,
              ease: "expo.out",
            },
            BEAT2 + i * 0.055
          );
        });

        /* ── Scene 2 (1.1–2.6s) — spring-pop card entrance with vertical
           motion-blur streak; ambient glow blooms landing on the settle. ── */
        var CARD_AT = 1.15;
        var CARD_DUR = 0.6;

        // motion-blur-streak (path A): proxy-tweened directional blur,
        // seeded at peak in the markup (stdDeviation="0 26").
        var blurNode = document.getElementById("f02s-streak-blur");
        var blurProxy = { v: 26 };
        var writeBlur = function () {
          blurNode.setAttribute("stdDeviation", "0 " + blurProxy.v);
        };

        tl.fromTo(
          "#f02s-move",
          { y: 460, scale: 0.7, rotation: 3, opacity: 0 },
          {
            y: 0,
            scale: 1,
            rotation: -4,
            opacity: 1,
            duration: CARD_DUR,
            ease: "expo.out",
          },
          CARD_AT
        );
        tl.to(
          blurProxy,
          { v: 0, duration: CARD_DUR, ease: "expo.out", onUpdate: writeBlur },
          CARD_AT
        );

        // ambient-glow-bloom (hero bloom): glow and card resolve as one beat
        var GLOW_PEAK = 0.32;
        tl.fromTo(
          "#f02s-glow",
          { opacity: 0, scale: 0.85 },
          { opacity: GLOW_PEAK, scale: 1, duration: 0.55, ease: "power2.out" },
          1.2
        );

        // bounded breathe during the hold — finite phase tween, sin(0)=0
        var glowEl = document.getElementById("f02s-glow");
        var glowPhase = { p: 0 };
        tl.to(
          glowPhase,
          {
            p: Math.PI * 2,
            duration: 2.6,
            ease: "none",
            onUpdate: function () {
              var s = Math.sin(glowPhase.p);
              glowEl.style.opacity = String(GLOW_PEAK + s * 0.03);
              glowEl.style.transform = "scale(" + (1 + s * 0.015) + ")";
            },
          },
          1.8
        );

        /* ── Scene 2.5 (1.9s) — snapshot de clientas entra con spring-pop ── */
        tl.fromTo(
          "#f02s-snap",
          { scale: 0.5, rotation: 18, autoAlpha: 0 },
          { scale: 1, rotation: 6, autoAlpha: 1, duration: 0.55, ease: "back.out(1.6)" },
          1.9
        );

        /* ── Scene 3 (2.6–3.6s) — Wallet badge slides in, long settle;
           soft keyword glow on "celular". ──────────────────────────────── */
        tl.fromTo(
          "#f02s-badge",
          { y: 150, opacity: 0 },
          { y: 0, opacity: 1, duration: 1.0, ease: "power3.out" },
          2.65
        );

        var kwEl = document.getElementById("f02s-kw");
        var kw = { g: 0 };
        var writeKw = function () {
          kwEl.style.textShadow =
            "0 0 " +
            kw.g * 18 +
            "px rgba(245,74,0,0.55), 0 0 " +
            kw.g * 40 +
            "px rgba(245,74,0,0.3)";
        };
        tl.to(kw, { g: 1, duration: 0.35, ease: "power2.out", onUpdate: writeKw }, 2.95);
        tl.to(kw, { g: 0, duration: 0.55, ease: "power2.inOut", onUpdate: writeKw }, 3.4);

        /* ── Scene 4 (3.6–4.5s) — held read; minimal sine jitter on the
           card wrapper only (half cycle, ends settled at sin(pi)=0). ───── */
        var jitterEl = document.getElementById("f02s-jitter");
        var jPhase = { p: 0 };
        tl.to(
          jPhase,
          {
            p: Math.PI,
            duration: 0.8,
            ease: "none",
            onUpdate: function () {
              jitterEl.style.transform =
                "translateY(" + Math.sin(jPhase.p) * 2.5 + "px)";
            },
          },
          3.7
        );

        window.__timelines["02-solucion"] = tl;
      })();
    </script>
