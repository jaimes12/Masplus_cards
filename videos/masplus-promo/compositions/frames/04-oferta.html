    #root {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      font-family: "Inter", sans-serif;
    }

    /* Full-bleed ground lives on the clip, never on #root */
    #oferta4-scene {
      position: absolute;
      inset: 0;
      background: #f54a00; /* fire-orange full-bleed */
      container-type: size;
      overflow: hidden;
    }

    /* — the hero number: fire-orange, Inter 900, tabular — */
    #oferta4-counterwrap {
      position: absolute;
      left: 0;
      right: 0;
      top: 280px;
      height: 520px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #oferta4-counter {
      display: inline-block;
      font-variant-numeric: tabular-nums; /* mandatory — no digit-width jitter while counting */
      font-weight: 900;
      font-size: 46cqw; /* final size is static; GSAP animates scale only */
      line-height: 1;
      letter-spacing: -0.04em;
      color: #18181b; /* tinta sobre naranja */
      transform-origin: center center;
      will-change: transform;
    }

    /* — display label: lowercase Inter 900, cream (system signature) — */
    #oferta4-title {
      position: absolute;
      left: 0;
      right: 0;
      top: 840px;
      text-align: center;
      font-weight: 900;
      font-size: 10.5cqw;
      line-height: 0.95;
      letter-spacing: -0.04em;
      text-transform: lowercase; /* Broadside: display is never uppercase */
      color: #ffffff; /* blanco sobre naranja */
      will-change: transform, filter;
    }

    /* — offer tags: sharp rectangles, 1px hairline, 0 radius (system: no rounded surface) — */
    .oferta4-tagrow {
      position: absolute;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
    }
    #oferta4-tag1 { top: 1078px; }
    #oferta4-tag2 { top: 1252px; }
    .oferta4-tag {
      display: flex;
      align-items: center;
      gap: 2cqw;
      padding: 2.4cqw 3.8cqw;
      background: #ffffff;
      border: 1px solid rgba(24, 24, 27, 0.25);
      font-weight: 600;
      font-size: 3.5cqw;
      line-height: 1.2;
      letter-spacing: -0.01em;
      color: #18181b;
      will-change: transform;
    }
    .oferta4-check {
      width: 3.4cqw;
      height: 3.4cqw;
      flex: 0 0 auto;
    }
    .oferta4-check path {
      fill: none;
      stroke: #f54a00; /* fire-orange — the system's only accent */
      stroke-width: 3.6;
      stroke-linecap: square; /* sharp, per the 0-radius plane */
      stroke-linejoin: miter;
      stroke-dasharray: 30;
    }

  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      var counter = document.getElementById("oferta4-counter");
      var state = { value: 0 };

      /* Scene 1 (0.0–1.4s) — counting-dynamic-scale:
         value 0→14 and transform scale grow on the SAME ease/duration.
         START_SCALE = 20% width / 55% width ≈ 0.36. */
      var COUNT_DUR = 1.2;
      var COUNT_EASE = "power3.out";

      tl.fromTo(
        "#oferta4-counter",
        { opacity: 0 },
        { opacity: 1, duration: 0.25, ease: "power2.out" },
        0
      );
      tl.to(
        state,
        {
          value: 14,
          duration: COUNT_DUR,
          ease: COUNT_EASE,
          onUpdate: function () {
            counter.textContent = Math.round(state.value);
          },
        },
        0
      );
      tl.fromTo(
        "#oferta4-counter",
        { scale: 0.36 },
        { scale: 1, duration: COUNT_DUR, ease: COUNT_EASE },
        0
      );

      /* Label lands as the count hits 14 — kinetic-beat-slam (scale+blur slam) */
      tl.fromTo(
