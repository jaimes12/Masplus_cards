<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #FFFFFF;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="20"
      data-width="1080"
      data-height="1920"
    >
      <audio
        id="bgm-funk"
        src="assets/bgm-funk.mp3"
        data-start="0"
        data-duration="20"
        data-media-start="20"
        data-automation='{"version":1,"lanes":[{"target":"volume","points":[{"t":0,"v":0},{"t":0.5,"v":0.9},{"t":18.2,"v":0.9},{"t":19.8,"v":0}]}]}'
      ></audio>
      <div
        id="el-01-dolor"
        class="scene"
        data-composition-id="01-dolor"
        data-composition-src="compositions/frames/01-dolor.html"
        data-start="0"
        data-duration="3.9"
        data-track-index="0"
      ></div>

      <div
        id="el-02-solucion"
        class="scene"
        data-composition-id="02-solucion"
        data-composition-src="compositions/frames/02-solucion.html"
        data-start="3.5"
        data-duration="5"
        data-track-index="1"
      ></div>

      <div
        id="el-03-como-funciona"
        class="scene"
        data-composition-id="03-como-funciona"
        data-composition-src="compositions/frames/03-como-funciona.html"
        data-start="8"
        data-duration="5.4"
        data-track-index="0"
      ></div>

      <div
        id="el-04-oferta"
        class="scene"
        data-composition-id="04-oferta"
        data-composition-src="compositions/frames/04-oferta.html"
        data-start="13"
        data-duration="4"
        data-track-index="1"
      ></div>

      <div
        id="el-05-cta"
        class="scene"
        data-composition-id="05-cta"
        data-composition-src="compositions/frames/05-cta.html"
        data-start="16.5"
        data-duration="3.5"
        data-track-index="0"
      ></div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-dolor", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 3.5);
        tl.fromTo("#el-02-solucion", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 3.5);
        tl.to("#el-02-solucion", { x: -1080, duration: 0.5, ease: "power3.inOut" }, 8);
        tl.fromTo("#el-03-como-funciona", { x: 1080, opacity: 1 }, { x: 0, duration: 0.5, ease: "power3.inOut" }, 8);
        tl.to("#el-03-como-funciona", { scaleX: 0, transformOrigin: "left center", duration: 0.4, ease: "power3.inOut" }, 13);
        tl.fromTo("#el-04-oferta", { scaleX: 0, transformOrigin: "right center", opacity: 1 }, { scaleX: 1, transformOrigin: "right center", duration: 0.4, ease: "power3.inOut" }, 13);
        tl.to("#el-04-oferta", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 16.5);
        tl.fromTo("#el-05-cta", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 16.5);
        tl.to({}, { duration: 20 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
